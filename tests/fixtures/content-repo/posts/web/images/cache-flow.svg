<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" role="img" aria-labelledby="title desc"><title id="title">HTTP cache flow</title><desc id="desc">Fresh responses come from cache. Stale responses are validated with the origin server.</desc><rect width="760" height="264" rx="12" fill="#f4f7f2"/><g font-family="sans-serif" font-size="15" fill="#25312b"><rect x="38" y="99" width="142" height="66" rx="8" fill="#fff" stroke="#cdd8cc"/><text x="109" y="138" text-anchor="middle">Browser</text><rect x="288" y="99" width="170" height="66" rx="8" fill="#e4eee3" stroke="#93b3a0"/><text x="373" y="138" text-anchor="middle">Cached response</text><rect x="566" y="99" width="154" height="66" rx="8" fill="#fff" stroke="#cdd8cc"/><text x="643" y="138" text-anchor="middle">Origin server</text><g stroke="#497b64" stroke-width="2" fill="none"><path d="M180 120h108m-8-5 8 5-8 5M288 146H180m8-5-8 5 8 5M458 120h108m-8-5 8 5-8 5M566 146H458m8-5-8 5 8 5"/></g><g font-size="12" fill="#526b58" text-anchor="middle"><text x="373" y="62">Fresh → reuse the stored response</text><text x="510" y="199">Stale → validate with ETag</text><text x="510" y="219">304 → reuse · 200 → replace</text></g></g></svg>
